<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Droply — Share files, fast</title>
  <meta name="description" content="Droply — share files fast with a short link. No account required.">
  <meta name="theme-color" content="#0a0e1a">

  <meta property="og:type" content="website">
  <meta property="og:title" content="Droply">
  <meta property="og:description" content="Share files instantly with Droply.">

  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="apple-touch-icon" href="/favicon.svg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/css/style.css">
</head>

<body>

  <div class="bg-blobs"><span></span></div>

  <div class="page">
    <div class="shell">
      <a class="brand" href="/">
        <img class="brand__mark" src="/img/logo-mark.svg" alt="" width="32" height="32">
        <span class="brand__name">Droply</span>
      </a>
      <p class="tagline">Drop a file. Get a link. It's gone in 24 hours.</p>

      <div class="card">
        <!-- Form state: idle / file selected / uploading -->
        <div id="formState">
          <h1 class="card__title">Share a file</h1>
          <p class="card__subtitle">Drag &amp; drop below, or click to browse.</p>

          <div class="dropzone" id="dropzone" tabindex="0" role="button" aria-label="Choose a file to upload">
            <svg class="dropzone__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 3v12"/>
              <path d="M7 8l5-5 5 5"/>
              <path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/>
            </svg>
            <p class="dropzone__text">Drag &amp; drop your file here</p>
            <p class="dropzone__hint">or click to browse &mdash; up to 5 GB</p>
            <input type="file" id="fileInput" />
          </div>

          <div class="file-chip hidden" id="fileChip">
            <span class="file-chip__icon" id="fileChipIcon" aria-hidden="true"></span>
            <span class="file-chip__meta">
              <span class="file-chip__name" id="fileChipName"></span>
              <span class="file-chip__size" id="fileChipSize"></span>
            </span>
            <button type="button" class="file-chip__remove" id="fileChipRemove" aria-label="Remove selected file">&times;</button>
          </div>

          <div class="progress hidden" id="progressWrap">
            <div class="progress__bar" id="progressBar"></div>
          </div>
          <p class="progress__label hidden" id="progressLabel" aria-live="polite"></p>

          <button class="btn btn--primary mt-4" id="uploadBtn" disabled>Create link</button>

          <div class="alert alert--error hidden mt-4" id="uploadError" aria-live="polite">
            <span class="alert__icon" aria-hidden="true">&#9888;&#65039;</span>
            <div>
              <p class="alert__title">Upload failed</p>
              <p class="alert__text" id="uploadErrorText"></p>
            </div>
          </div>
        </div>

        <!-- Success state -->
        <div id="successState" class="hidden">
          <div class="alert alert--success">
            <span class="alert__icon" aria-hidden="true">&#9989;</span>
            <div>
              <p class="alert__title">Your link is ready</p>
              <p class="alert__text" id="successExpiry"></p>
            </div>
          </div>

          <div class="link-box mt-4">
            <input type="text" class="link-box__input" id="linkInput" readonly>
            <button type="button" class="btn btn--primary link-box__copy" id="copyBtn">Copy</button>
          </div>

          <button type="button" class="btn btn--secondary mt-4" id="resetBtn">Upload another file</button>
        </div>
      </div>

      <p class="footer-note">No account required. Files are deleted automatically after 24 hours.</p>
    </div>
  </div>

  <script>
    const MAX_SIZE = 5 * 1024 * 1024 * 1024; // 5 GB

    function formatBytes(bytes) {
      if (bytes === 0) return "0 B";
      const units = ["B", "KB", "MB", "GB"];
      const i = Math.min(Math.floor(Math.log(bytes) / Math.log(1024)), units.length - 1);
      const value = bytes / Math.pow(1024, i);
      return `${value.toFixed(i === 0 ? 0 : 1)} ${units[i]}`;
    }

    function formatExpiry(expiresAtMs) {
      const diff = expiresAtMs - Date.now();
      if (diff <= 0) return "This link has expired.";
      const hours = Math.floor(diff / 3600000);
      const minutes = Math.floor((diff % 3600000) / 60000);
      if (hours > 0) return `Expires in ${hours}h ${minutes}m.`;
      return `Expires in ${minutes}m.`;
    }

    function getFileIcon(filename) {
      const ext = (filename.split(".").pop() || "").toLowerCase();
      if (["png", "jpg", "jpeg", "gif", "svg", "webp"].includes(ext)) return "\u{1F5BC}️";
      if (["mp4", "mov", "avi", "mkv", "webm"].includes(ext)) return "\u{1F3AC}";
      if (["mp3", "wav", "flac", "ogg"].includes(ext)) return "\u{1F3B5}";
      if (["zip", "rar", "7z", "tar", "gz"].includes(ext)) return "\u{1F5DC}️";
      if (ext === "pdf") return "\u{1F4D5}";
      if (["doc", "docx", "txt", "md"].includes(ext)) return "\u{1F4C4}";
      if (["js", "ts", "py", "html", "css", "json", "java", "c", "cpp"].includes(ext)) return "\u{1F9E9}";
      return "\u{1F4E6}";
    }

    function copyToClipboard(text, btn) {
      const done = () => {
        const original = btn.textContent;
        btn.textContent = "Copied!";
        setTimeout(() => { btn.textContent = original; }, 2000);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
      } else {
        fallbackCopy(text, done);
      }
    }

    function fallbackCopy(text, done) {
      const temp = document.createElement("textarea");
      temp.value = text;
      temp.style.position = "fixed";
      temp.style.opacity = "0";
      document.body.appendChild(temp);
      temp.select();
      try { document.execCommand("copy"); done(); } catch (err) { /* ignore */ }
      document.body.removeChild(temp);
    }

    const dropzone = document.getElementById("dropzone");
    const fileInput = document.getElementById("fileInput");
    const fileChip = document.getElementById("fileChip");
    const fileChipIcon = document.getElementById("fileChipIcon");
    const fileChipName = document.getElementById("fileChipName");
    const fileChipSize = document.getElementById("fileChipSize");
    const fileChipRemove = document.getElementById("fileChipRemove");
    const uploadBtn = document.getElementById("uploadBtn");
    const uploadError = document.getElementById("uploadError");
    const uploadErrorText = document.getElementById("uploadErrorText");
    const progressWrap = document.getElementById("progressWrap");
    const progressBar = document.getElementById("progressBar");
    const progressLabel = document.getElementById("progressLabel");
    const formState = document.getElementById("formState");
    const successState = document.getElementById("successState");
    const successExpiry = document.getElementById("successExpiry");
    const linkInput = document.getElementById("linkInput");
    const copyBtn = document.getElementById("copyBtn");
    const resetBtn = document.getElementById("resetBtn");

    let selectedFile = null;

    function showUploadError(message) {
      uploadErrorText.textContent = message;
      uploadError.classList.remove("hidden");
    }

    function hideUploadError() {
      uploadError.classList.add("hidden");
    }

    function selectFile(file) {
      if (!file) return;
      hideUploadError();

      if (file.size > MAX_SIZE) {
        showUploadError("This file exceeds the 5 GB limit.");
        return;
      }

      selectedFile = file;
      dropzone.classList.add("hidden");
      fileChipIcon.textContent = getFileIcon(file.name);
      fileChipName.textContent = file.name;
      fileChipSize.textContent = formatBytes(file.size);
      fileChip.classList.remove("hidden");
      uploadBtn.disabled = false;
    }

    function resetToIdle() {
      selectedFile = null;
      fileInput.value = "";
      dropzone.classList.remove("hidden");
      fileChip.classList.add("hidden");
      uploadBtn.disabled = true;
      uploadBtn.textContent = "Create link";
      progressWrap.classList.add("hidden");
      progressLabel.classList.add("hidden");
      hideUploadError();
      formState.classList.remove("hidden");
      successState.classList.add("hidden");
    }

    dropzone.addEventListener("click", () => fileInput.click());
    dropzone.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); fileInput.click(); }
    });

    fileInput.addEventListener("change", (e) => selectFile(e.target.files[0]));

    dropzone.addEventListener("dragover", (e) => {
      e.preventDefault();
      dropzone.classList.add("is-dragover");
    });
    dropzone.addEventListener("dragleave", () => dropzone.classList.remove("is-dragover"));
    dropzone.addEventListener("drop", (e) => {
      e.preventDefault();
      dropzone.classList.remove("is-dragover");
      selectFile(e.dataTransfer.files[0]);
    });

    fileChipRemove.addEventListener("click", resetToIdle);
    resetBtn.addEventListener("click", resetToIdle);

    copyBtn.addEventListener("click", () => copyToClipboard(linkInput.value, copyBtn));

    function uploadFile(file) {
      const xhr = new XMLHttpRequest();
      const formData = new FormData();
      formData.append("file", file);

      uploadBtn.disabled = true;
      uploadBtn.textContent = "Uploading…";
      progressWrap.classList.remove("hidden");
      progressLabel.classList.remove("hidden");
      progressBar.style.width = "0%";
      progressLabel.textContent = "0%";

      xhr.upload.addEventListener("progress", (e) => {
        if (!e.lengthComputable) return;
        const pct = Math.round((e.loaded / e.total) * 100);
        progressBar.style.width = `${pct}%`;
        progressLabel.textContent = `${pct}%`;
      });

      xhr.addEventListener("load", () => {
        let data = null;
        try { data = JSON.parse(xhr.responseText); } catch (err) { /* ignore */ }

        if (xhr.status >= 200 && xhr.status < 300 && data && data.success) {
          linkInput.value = data.url;
          successExpiry.textContent = formatExpiry(data.expiresAt);
          formState.classList.add("hidden");
          successState.classList.remove("hidden");
        } else {
          onUploadError((data && data.error) || "Upload failed. Please try again.");
        }
      });

      xhr.addEventListener("error", () => onUploadError("Network error. Please check your connection and try again."));

      xhr.open("POST", "/api/upload");
      xhr.send(formData);
    }

    function onUploadError(message) {
      progressWrap.classList.add("hidden");
      progressLabel.classList.add("hidden");
      uploadBtn.disabled = false;
      uploadBtn.textContent = "Create link";
      showUploadError(message);
    }

    uploadBtn.addEventListener("click", () => {
      if (!selectedFile) return;
      hideUploadError();
      uploadFile(selectedFile);
    });
  </script>

</body>
</html>
